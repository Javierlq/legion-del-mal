name: Comunicador de la Legion

on:
  workflow_dispatch:
    inputs:
        villano:
            description: '¿Qué villano envía el mensaje?'
            required: true
            type: choice
            options:
                - Deathstroke
                - Joker
                - Brainiac
                - Lex Luthor

        mensaje: 
          description: "Mensaje a transmitir"
          required: true
          type: string
          default: "La misión fue un éxito"


        prioridad:
          description: "Nivel de prioridad"
          required: true
          type: choice
          options:
              - Alta
              - Media
              - Baja

jobs: 
    transmitir_mensaje:
        runs-on: ubuntu-latest

        steps:
          - name: Imprimir inputs
            run: |
              echo "Villano: ${{ github.event.inputs.villano }}"
              echo "Mensaje: ${{ github.event.inputs.mensaje }}"
              echo "Prioridad: ${{ github.event.inputs.prioridad }}"